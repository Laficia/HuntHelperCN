name: Publish CN release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package and expand reviewed source
        run: |
          sha256sum -c SHA256SUMS.txt
          cp latest.zip "$RUNNER_TEMP/latest.zip"
          python3 - <<'PY'
          import json, os, pathlib, re, zipfile
          version = json.loads(pathlib.Path('pluginmaster.json').read_text(encoding='utf-8'))[0]['AssemblyVersion']
          if not re.fullmatch(r'\d+\.\d+\.\d+\.\d+', version):
              raise RuntimeError('Invalid release version')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'VERSION={version}\n')
          with zipfile.ZipFile('source.zip') as z:
              for name in z.namelist():
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts or '.git' in p.parts:
                      raise RuntimeError('Unsafe source archive path')
              z.extractall('.')
          PY
          cp README-CN.md README.md
      - name: Commit published source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm source.zip latest.zip
          git add -A
          git commit -m "Publish HuntHelperCN $VERSION source and index"
          git push origin HEAD:main
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$RUNNER_TEMP/latest.zip" SHA256SUMS.txt --title "HuntHelperCN $VERSION" --notes-file release-notes.zh-CN.md --target "$(git rev-parse HEAD)"
