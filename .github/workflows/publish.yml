name: Publish CN release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package and expand reviewed source
        run: |
          sha256sum -c SHA256SUMS.txt
          cp latest.zip "$RUNNER_TEMP/latest.zip"
          python3 - <<'PY'
          import zipfile, pathlib
          with zipfile.ZipFile('source.zip') as z:
              for name in z.namelist():
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts or '.git' in p.parts:
                      raise RuntimeError('Unsafe source archive path')
              z.extractall('.')
          PY
          cp README-CN.md README.md
      - name: Commit published source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm source.zip latest.zip
          git add -A
          git commit -m 'Publish HuntHelperCN 1.0.0.35 source and index'
          git push origin HEAD:main
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0.35 "$RUNNER_TEMP/latest.zip" SHA256SUMS.txt --title 'HuntHelperCN 1.0.0.35' --notes-file release-notes.zh-CN.md --target "$(git rev-parse HEAD)"
